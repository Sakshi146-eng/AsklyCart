services:
  # ── Backend — FastAPI + LangGraph Orchestrator ──────────────
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: commerceops_app
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://commerceops:commerceops@postgres:5432/commerceops
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_started   # Qdrant image has no curl/wget, use started not healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped
    networks:
      - commerceops

  # NOTE: Frontend runs LOCALLY (not in Docker).
  #   cd frontend && npm install && npm run dev
  #   → http://localhost:3000
  # Vite dev proxy forwards /api/* → http://localhost:8000

  # ── PostgreSQL — Audit log + products ──────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: commerceops_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: commerceops
      POSTGRES_PASSWORD: commerceops
      POSTGRES_DB: commerceops
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerceops -d commerceops"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - commerceops

  # ── Redis — Session/cart state ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: commerceops_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - commerceops

  # ── RabbitMQ — Retry queue ─────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: commerceops_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI → http://localhost:15672 (guest/guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - commerceops

  # ── Qdrant — Vector search ─────────────────────────────────
  # NOTE: No healthcheck — the qdrant image has no curl/wget/python.
  #       The app handles Qdrant unavailability gracefully on startup.
  qdrant:
    image: qdrant/qdrant:v1.11.4
    container_name: commerceops_qdrant
    ports:
      - "6333:6333"  # HTTP API  → http://localhost:6333/dashboard
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - commerceops

# ── Volumes ─────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  qdrant_data:
    driver: local

# ── Network ─────────────────────────────────────────────────
networks:
  commerceops:
    driver: bridge
